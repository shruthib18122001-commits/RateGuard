version: "3.9"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: redis://redis:6379/0
      RATE_LIMIT_RATE: "5"
      RATE_LIMIT_CAPACITY: "10"
      ADMIN_API_KEY: "admin"
      REDIS_SOCKET_TIMEOUT: "0.5"
      BREAKER_FAILURE_THRESHOLD: "5"
      BREAKER_RESET_TIMEOUT: "10"
      BREAKER_FALLBACK_POLICY: FAIL_OPEN
      OTEL_TRACING_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4317
    depends_on:
      - redis
      - tempo

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - app

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - tempo

  tempo:
    # Pinned: Tempo 3.x changed the deployment model/config format.
    image: grafana/tempo:2.8.2
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./monitoring/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
    ports:
      - "3200:3200"   # Tempo HTTP API (queried by Grafana)
      - "4317:4317"   # OTLP gRPC (lets a locally run uvicorn export too)
