# Single-binary Tempo for local dev: OTLP in, traces on local disk, queried
# by Grafana on :3200. Storage is under /tmp inside the container (writable
# by Tempo's non-root user), so traces don't survive a container recreate.
stream_over_http_enabled: true

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    wal:
      path: /tmp/tempo/wal
    local:
      path: /tmp/tempo/blocks
